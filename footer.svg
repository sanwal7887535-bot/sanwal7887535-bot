<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
<title id="title">Build with purpose — Muhammad Sanwal</title>
<desc id="desc">Animated matching graphite and teal footer with circuit traces and a scanning light line.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#103b39"/><stop offset=".5" stop-color="#0b1117"/><stop offset="1" stop-color="#101820"/></linearGradient>
 <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#5eead4" stroke-opacity=".08"/></pattern>
 <linearGradient id="scan"><stop offset="0" stop-color="#5eead4" stop-opacity="0"/><stop offset=".5" stop-color="#5eead4"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></linearGradient>
</defs>
<rect width="1200" height="230" fill="url(#bg)"/><rect width="1200" height="230" fill="url(#grid)"/>
<path d="M0 44H170L202 76H288M1200 42H1055L1020 78H950M0 184H115L146 153H212M1200 185H1070L1038 154H970" fill="none" stroke="#2dd4bf" stroke-opacity=".48" stroke-width="1.5"/>
<path d="M0 2H1200" stroke="#5eead4" stroke-width="2"/>
<text x="600" y="76" text-anchor="middle" fill="#5eead4" font-family="monospace" font-size="12" letter-spacing="5">END OF TRANSMISSION</text>
<text x="600" y="121" text-anchor="middle" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" letter-spacing="2">BUILD WITH PURPOSE.</text>
<text x="600" y="153" text-anchor="middle" fill="#b7c9d1" font-family="monospace" font-size="12" letter-spacing="2">ENGINEER / AUTOMATE / SECURE / IMPROVE</text>
<text x="600" y="194" text-anchor="middle" fill="#5eead4" font-family="monospace" font-size="11" letter-spacing="2">MUHAMMAD SANWAL  |  SOFTWARE DEVELOPMENT</text>
<rect x="0" y="224" width="260" height="3" fill="url(#scan)"><animate attributeName="x" values="-260;1200;-260" dur="7s" repeatCount="indefinite"/></rect>
<circle cx="160" cy="44" r="3" fill="#5eead4"><animate attributeName="opacity" values=".25;1;.25" dur="2.6s" repeatCount="indefinite"/></circle>
<circle cx="1038" cy="154" r="3" fill="#5eead4"><animate attributeName="opacity" values=".25;1;.25" dur="3.1s" repeatCount="indefinite"/></circle>
</svg>