</defs><rect width="1200" height="290" rx="22" fill="#0A0F1C"/><rect x="14" y="14" width="690" height="262" rx="18" fill="url(#pg)" stroke="#14B8A6" stroke-opacity="0.5"/><rect x="14" y="14" width="690" height="262" rx="18" fill="none" stroke="#5EEAD4" stroke-width="2" stroke-dasharray="160 1700"><animate attributeName="stroke-dashoffset" from="0" to="-1860" dur="8s" repeatCount="indefinite"/></rect><text x="44" y="52" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#14B8A6" text-anchor="start" letter-spacing="4">EDUCATION</text><text x="44" y="94" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="url(#tt)" text-anchor="start" >Bachelor of Science in</text><text x="44" y="128" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="url(#tt)" text-anchor="start" >Information Technology</text><text x="44" y="160" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="600" fill="#E6EDF3" text-anchor="start" >University of the Punjab  ·  Lahore, Pakistan</text><rect x="44" y="176" width="150" height="28" rx="14" fill="#14B8A6" fill-opacity="0.15" stroke="#14B8A6"/><circle cx="62" cy="190" r="4" fill="#5EEAD4"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite"/></circle><text x="76" y="194.5" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12" font-weight="700" fill="#5EEAD4" text-anchor="start" >2023 — PRESENT</text><text x="44" y="232" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8B9BB4" text-anchor="start" >Academic interests include software engineering, database systems, data</text><text x="44" y="252" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#8B9BB4" text-anchor="start" >structures, algorithms, web development, and artificial intelligence.</text><rect x="722" y="14" width="464" height="262" rx="18" fill="url(#pg)" stroke="#8B5CF6" stroke-opacity="0.5"/><text x="750" y="52" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13" font-weight="700" fill="#A78BFA" text-anchor="start" letter-spacing="4">ACADEMIC HIGHLIGHTS</text><g opacity="0"><rect x="750" y="70" width="5" height="44" rx="2.5" fill="#F59E0B"/><circle cx="780" cy="92" r="14" fill="#F59E0B" fill-opacity="0.16"/><circle cx="780" cy="92" r="4.5" fill="#F59E0B"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></circle><text x="806" y="89" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="start" >District-level recognition</text><text x="806" y="109" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#8B9BB4" text-anchor="start" >First position in matriculation at district level.</text><animate attributeName="opacity" from="0" to="1" begin="0.40s" dur="0.6s" fill="freeze"/></g><g opacity="0"><rect x="750" y="130" width="5" height="44" rx="2.5" fill="#22D3EE"/><circle cx="780" cy="152" r="14" fill="#22D3EE" fill-opacity="0.16"/><circle cx="780" cy="152" r="4.5" fill="#22D3EE"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="0.5s" repeatCount="indefinite"/></circle><text x="806" y="149" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="start" >Scholarship</text><text x="806" y="169" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#8B9BB4" text-anchor="start" >Fully funded scholarship at Akhuwat Institute.</text><animate attributeName="opacity" from="0" to="1" begin="0.70s" dur="0.6s" fill="freeze"/></g><g opacity="0"><rect x="750" y="190" width="5" height="44" rx="2.5" fill="#F43F5E"/><circle cx="780" cy="212" r="14" fill="#F43F5E" fill-opacity="0.16"/><circle cx="780" cy="212" r="4.5" fill="#F43F5E"><animate attributeName="r" values="4;7;4" dur="2.4s" begin="1.0s" repeatCount="indefinite"/></circle><text x="806" y="209" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15.5" font-weight="700" fill="#FFFFFF" text-anchor="start" >Practical development</text><text x="806" y="229" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#8B9BB4" text-anchor="start" >Software, AI application, and enterprise security projects.</text><animate attributeName="opacity" from="0" to="1" begin="1.00s" dur="0.6s" fill="freeze"/></g></svg>