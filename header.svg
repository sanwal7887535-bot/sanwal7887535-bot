
<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="330" viewBox="0 0 1200 330"
     role="img" aria-labelledby="title desc">

  <title id="title">Muhammad Sanwal — Animated Engineering Portfolio</title>
  <desc id="desc">Animated graphite and teal portfolio banner featuring glowing animated typography, traveling light streaks, moving circuit arrows, and a pulsing geometric network.</desc>

  <defs>
    <!-- Background -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101820"/>
      <stop offset=".58" stop-color="#0b1117"/>
      <stop offset="1" stop-color="#103b39"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d9488" stop-opacity="0"/>
      <stop offset=".5" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#0d9488" stop-opacity="0"/>
    </linearGradient>

    <!-- Moving light gradient -->
    <linearGradient id="movingGlow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset=".45" stop-color="#5eead4" stop-opacity=".2"/>
      <stop offset=".5" stop-color="#ffffff"/>
      <stop offset=".55" stop-color="#5eead4" stop-opacity=".9"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform"
                        type="translate"
                        values="-1 0;1 0;-1 0"
                        dur="5s"
                        repeatCount="indefinite"/>
    </linearGradient>

    <pattern id="grid" width="30" height="30"
             patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none"
            stroke="#5eead4" stroke-opacity=".08"
            stroke-width="1"/>
    </pattern>

    <!-- Glow filters -->
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-80%" width="200%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.18
                0 0 0 0 0.95
                0 0 0 0 0.83
                0 0 0 1 0" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow marker -->
    <marker id="arrowHead" markerWidth="7" markerHeight="7"
            refX="5" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7Z" fill="#5eead4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="330" fill="url(#bg)"/>
  <rect width="1200" height="330" fill="url(#grid)"/>

  <!-- Subtle scanning light across the whole banner -->
  <rect x="-300" y="0" width="180" height="330"
        fill="url(#movingGlow)" opacity=".22">
    <animate attributeName="x"
             values="-300;1300;-300"
             dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner circuit paths -->
  <g fill="none" stroke="#2dd4bf"
     stroke-width="1.5" stroke-opacity=".55">

    <path id="topLeftPath" d="M0 58H120L154 92H228"/>
    <path d="M0 82H72L103 113H150"/>

    <path id="topRightPath" d="M1200 52H1080L1042 90H990"/>
    <path d="M1200 79H1138L1107 110H1068"/>

    <path d="M800 0V34L827 61V95"/>
    <path d="M890 330V282L922 250H970"/>
    <path d="M65 330V287L94 258H140"/>
  </g>

  <!-- Animated light traveling around circuit corners -->
  <g fill="#5eead4" filter="url(#strongGlow)">
    <circle r="4">
      <animateMotion dur="4s" repeatCount="indefinite"
                     path="M0 58H120L154 92H228"/>
      <animate attributeName="opacity"
               values=".15;1;.5;1;.15"
               dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle r="4">
      <animateMotion dur="4.8s" repeatCount="indefinite"
                     path="M1200 52H1080L1042 90H990"/>
      <animate attributeName="opacity"
               values=".2;1;.3;1;.2"
               dur="4.8s" repeatCount="indefinite"/>
    </circle>

    <circle r="3">
      <animateMotion dur="5s" repeatCount="indefinite"
                     path="M65 330V287L94 258H140"/>
    </circle>

    <circle r="3">
      <animateMotion dur="5.5s" repeatCount="indefinite"
                     path="M800 0V34L827 61V95"/>
    </circle>
  </g>

  <!-- Traveling light streaks -->
  <g filter="url(#glow)">
    <path d="M0 0H100" stroke="url(#line)" stroke-width="3">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="-120 45;1320 45"
                        dur="7s" repeatCount="indefinite"/>
    </path>

    <path d="M0 0H75" stroke="#5eead4"
          stroke-width="2" opacity=".8">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="1300 125;-150 125"
                        dur="8s" repeatCount="indefinite"/>
    </path>

    <path d="M0 0H90" stroke="url(#line)" stroke-width="3">
      <animateTransform attributeName="transform"
                        type="translate"
                        values="-100 310;1300 310"
                        dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Arrow that draws itself, then moves -->
  <g fill="none" stroke="#5eead4" stroke-width="2"
     filter="url(#glow)">
    <path d="M325 239H410L430 239H470"
          stroke-dasharray="150"
          stroke-dashoffset="150"
          marker-end="url(#arrowHead)">
      <animate attributeName="stroke-dashoffset"
               values="150;0;0;150"
               keyTimes="0;.25;.75;1"
               dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values="0;1;1;0"
               keyTimes="0;.2;.8;1"
               dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Main animated name -->
  <g filter="url(#strongGlow)">
    <text x="60" y="151"
          fill="#f8fafc"
          font-family="Arial, Helvetica, sans-serif"
          font-size="58"
          font-weight="700"
          letter-spacing="1.5">
      MUHAMMAD
      <!-- Gentle floating motion -->
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;0 -3;0 0;0 2;0 0"
                        dur="5s" repeatCount="indefinite"/>
      <!-- Soft opacity pulse -->
      <animate attributeName="opacity"
               values=".88;1;.92;1;.88"
               dur="4s" repeatCount="indefinite"/>
    </text>

    <text x="60" y="215"
          fill="#f8fafc"
          font-family="Arial, Helvetica, sans-serif"
          font-size="58"
          font-weight="700"
          letter-spacing="1.5">
      SANWAL<tspan fill="#5eead4">.</tspan>
      <animateTransform attributeName="transform"
                        type="translate"
                        values="0 0;0 -3;0 0;0 2;0 0"
                        dur="5s" begin=".3s"
                        repeatCount="indefinite"/>
      <animate attributeName="opacity"
               values=".9;1;.93;1;.9"
               dur="3.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Moving highlight sweeps over the name -->
  <rect x="45" y="103" width="500" height="120"
        fill="url(#movingGlow)" opacity=".2"
        filter="url(#glow)">
    <animate attributeName="x"
             values="-520;650;-520"
             dur="6s" repeatCount="indefinite"/>
  </rect>

  <!-- Animated underline -->
  <rect x="64" y="239" width="250" height="3"
        rx="1.5" fill="url(#line)">
    <animate attributeName="width"
             values="40;250;170;250;40"
             dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values=".4;1;.65;1;.4"
             dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtitle -->
  <g font-family="monospace" font-size="13"
     letter-spacing="1.5">
    <text x="65" y="272" fill="#d5e2e8">
      SOFTWARE DEVELOPMENT / AI AUTOMATION
      <animate attributeName="opacity"
               values=".65;1;.65"
               dur="4s" repeatCount="indefinite"/>
    </text>

    <text x="65" y="296" fill="#9fb3bd">
      DATABASE SYSTEMS / ERP SECURITY
      <animate attributeName="opacity"
               values="1;.55;1"
               dur="4.5s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Animated geometric network -->
  <g transform="translate(930 112)"
     fill="none" stroke="#5eead4"
     stroke-width="1.4" stroke-opacity=".75">

    <rect x="0" y="0" width="150" height="150" rx="2">
      <animate attributeName="stroke-opacity"
               values=".35;.9;.35"
               dur="3s" repeatCount="indefinite"/>
    </rect>

    <rect x="17" y="17" width="116" height="116"
          rx="2" stroke-opacity=".5">
      <animateTransform attributeName="transform"
                        type="rotate"
                        values="0 75 75;90 75 75;180 75 75;270 75 75;360 75 75"
                        dur="24s" repeatCount="indefinite"/>
    </rect>

    <path d="M75 0V-25M75 150V175M0 75H-25M150 75H175"/>
    <path d="M17 17L133 133M133 17L17 133"
          stroke-opacity=".22"/>

    <circle cx="75" cy="75" r="34">
      <animate attributeName="r"
               values="27;38;27"
               dur="4s" repeatCount="indefinite"/>
    </circle>

    <circle cx="75" cy="75" r="13"
            fill="#5eead4" fill-opacity=".15">
      <animate attributeName="fill-opacity"
               values=".05;.4;.05"
               dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <circle cx="75" cy="75" r="4"
            fill="#5eead4" stroke="none">
      <animate attributeName="r"
               values="3;6;3"
               dur="1.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Orbital light moving around the network -->
    <circle cx="75" cy="0" r="3"
            fill="#ffffff" stroke="none"
            filter="url(#strongGlow)">
      <animateMotion dur="4s" repeatCount="indefinite"
                     path="M75 0 A75 75 0 1 1 74.9 0"/>
    </circle>
  </g>

  <!-- Bottom status label -->
  <text x="1128" y="304" text-anchor="middle"
        fill="#5eead4" font-family="monospace"
        font-size="11" letter-spacing="1.2">
    MS / 01
    <animate attributeName="opacity"
             values=".45;1;.45"
             dur="2.5s" repeatCount="indefinite"/>
  </text>

  <!-- Bottom animated edge -->
  <rect x="0" y="326" width="1200" height="4"
        fill="#5eead4" filter="url(#glow)">
    <animate attributeName="opacity"
             values=".3;1;.3"
             dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Moving corner indicator -->
  <circle cx="1180" cy="18" r="3"
          fill="#ffffff" filter="url(#strongGlow)">
    <animate attributeName="cx"
             values="1180;1090;1180"
             dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy"
             values="18;55;18"
             dur="4s" repeatCount="indefinite"/>
  </circle>

</svg>
