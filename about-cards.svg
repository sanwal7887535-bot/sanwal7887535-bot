begin="0.8999999999999999s" repeatCount="indefinite"/></circle><text x="664" y="359" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#D0D8E4" text-anchor="start" >Use automation to remove repetitive work.</text><animate attributeName="opacity" from="0" to="1" begin="1.04s" dur="0.6s" fill="freeze"/></g><g opacity="0"><circle cx="642" cy="385" r="9" fill="#8B5CF6" fill-opacity="0.16"/><circle cx="642" cy="385" r="3.5" fill="#8B5CF6"><animate attributeName="r" values="3;5;3" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></circle><text x="664" y="390" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#D0D8E4" text-anchor="start" >Learn by building, testing, and improving.</text><animate attributeName="opacity" from="0" to="1" begin="1.22s" dur="0.6s" fill="freeze"/></g></svg>